<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an Account - BiteDash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fff9f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .Main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 900px;
            width: 100%;
        }

        .Login {
            width: 350px;
        }

        .Login h1 {
            font-size: 26px;
            color: #222;
            margin-bottom: 8px;
        }

        .Login  p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-field {
            width: 100%;
            height: 45px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #ff4757;
        }

        .submit-btn {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #ff4757;
        }

        .or-text {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin: 20px 0;
            font-weight: bold;
        }

        .social-btn {
            width: 100%;
            height: 42px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            text-decoration: none;
            color: #333;
            transition: background 0.3s;
        }

        .social-btn:hover {
            background: #f1f1f1;
        }

        .social-btn.facebook i {
            color: #1877f2;
        }

        .social-btn.google i {
            color: #ea4335;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #ff4757;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .image-box img {
            border-radius: 15px;
            object-fit: cover;
            width: 350px;
            height: 480px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .Main {
                flex-direction: column;
                padding: 20px;
            }
            .image-box img {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="Main">
        <div class="Login">
            <h1>Create an account</h1>
            <p>Sign up with your valid email and password</p>
            
            <form action="home.html" method="GET">
                <input class="input-field" type="text" placeholder="Username" required>
                <input class="input-field" type="email" placeholder="Email" required>
                <input class="input-field" type="password" placeholder="Password" required>
                
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <p class="or-text">or sign up with</p>
            
            <a href="#" class="social-btn facebook">
                <i class="fa-brands fa-facebook"></i> Sign up with Facebook
            </a>
            
            <a href="#" class="social-btn google">
                <i class="fa-brands fa-google"></i> Sign up with Google
            </a>

            <p class="login-link">Don't have an account? <a href="index.html">Sign Up</a></p>
        </div>

        <div class="image-box">
            <img src="images/pizza.jpg" alt="Delicious Pizza">
        </div>
    </div>

</body>
</html>
